name: release

# A version merged to main is a release: this tags it v<version> and publishes
# its section of RELEASE-NOTES.md as a GitHub Release, so nobody does it by
# hand. A merge that does not move the version finds its release already there
# and does nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag and publish the version, once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(perl -MJSON::PP -e 'local $/; open my $h, "<", ".claude-plugin/plugin.json" or die; print JSON::PP->new->decode(<$h>)->{version}')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          VERSION="$version" perl -ne '
            if (/^## v\Q$ENV{VERSION}\E(?: |$)/) { $on = 1; next }
            exit if $on && /^## /;
            print if $on;
          ' RELEASE-NOTES.md > notes.md
          [ -s notes.md ] || { echo "no section for v$version in RELEASE-NOTES.md" >&2; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
