name: release

# A version merged to main is a release: this tags it v<version> and publishes
# its section of RELEASE-NOTES.md as a GitHub Release, once. On every merge it
# points the `release` branch at the files an install uses, taken from that tag,
# so nobody does any of it by hand. Anthropic's directory follows `release`, and
# so sees releases, not every merge; from an organisation it has not verified it
# accepts only Markdown, text, JSON, YAML and images, so the repository's own
# tooling stays out of `release`.
on:
  push:
    branches: [main]

# One run at a time: each moves `release` on from where the last one left it.
concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish the version, once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(perl -MJSON::PP -e 'local $/; open my $h, "<", ".claude-plugin/plugin.json" or die; print JSON::PP->new->decode(<$h>)->{version}')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          VERSION="$version" perl -ne '
            if (/^## v\Q$ENV{VERSION}\E(?: |$)/) { $on = 1; next }
            exit if $on && /^## /;
            print if $on;
          ' RELEASE-NOTES.md > notes.md
          [ -s notes.md ] || { echo "no section for v$version in RELEASE-NOTES.md" >&2; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md

      - name: Point release at the files an install uses, from the tag
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          tag="v$VERSION"
          # The step above may have just made the tag, on GitHub.
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          # What ships is the tag's own SHIPPED list, with the readme and the
          # licence.
          shipped=$(git show "$tag:scripts/version-check.sh" | sed -n "s/^SHIPPED='\(.*\)'$/\1/p")
          [ -n "$shipped" ] || { echo "$tag has no SHIPPED list in scripts/version-check.sh" >&2; exit 1; }
          paths="$shipped README.md LICENSE"
          for path in $paths; do
            git cat-file -e "$tag:$path" || { echo "$tag has no $path" >&2; exit 1; }
          done
          export GIT_INDEX_FILE="$RUNNER_TEMP/release-index"
          git ls-tree -r "$tag" -- $paths | git update-index --add --index-info
          tree=$(git write-tree)
          # Each release follows the last, so whoever tracks `release` moves by
          # a fast-forward, and the same files push nothing.
          last=$(git rev-parse --verify --quiet refs/remotes/origin/release || true)
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{tree}")" = "$tree" ]; then
            echo "release already carries $tag"
            exit 0
          fi
          commit=$(git commit-tree "$tree" ${last:+-p "$last"} -m "$tag: the files an install uses, from $(git rev-parse --short "$tag^{commit}")")
          # Nobody commits to `release`: it only ever carries the last release.
          git push origin "$commit:refs/heads/release"
